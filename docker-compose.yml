services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: database
    ports:
      - "5434:5432"
    volumes:
      - postgres_data_1:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d database"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data_1:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: bulk-url-db-migrate
    working_dir: /app/db
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/database
    depends_on:
      postgres:
        condition: service_healthy
    command: ["ash", "-lc", "bunx drizzle-kit push --config ./drizzle.config.ts"]
    restart: "no"

  api-1:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: bulk-url-api-1
    working_dir: /app/server
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/database
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    ports:
      - "8001:8000"
    command: ["bun", "run", "src/server.ts"]

  api-2:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: bulk-url-api-2
    working_dir: /app/server
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/database
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    ports:
      - "8002:8000"
    command: ["bun", "run", "src/server.ts"]

  nginx:
    image: nginx:alpine
    container_name: bulk-url-nginx
    depends_on:
      - api-1
      - api-2
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: bulk-url-client
    working_dir: /app/client
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8080/
      INTERNAL_API_BASE: http://nginx:80/
      PORT: 3000
      NODE_ENV: development
    depends_on:
      - nginx
    ports:
      - "3000:3000"
    command: ["bun", "run", "dev", "--", "--hostname", "0.0.0.0", "--port", "3000"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    working_dir: /app/worker
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/database
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    command: ["bun", "run", "src/index.ts"]
    deploy:
      replicas: 3

volumes:
  postgres_data_1:
  redis_data_1:
